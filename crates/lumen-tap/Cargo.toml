[package]
name = "lumen-tap"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lumen's taskbar helper, loaded into Explorer through XAML diagnostics"

[lib]
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
]

[features]
dev-logs = []

[dependencies]
windows-core = "0.58"
