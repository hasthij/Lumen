[package]
name = "lumen-setup"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer and uninstaller for Lumen (one self-contained exe)"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
